openapi: 3.0.3
info:
  title: RSS Feed Reader MVP API
  version: 1.0.0
paths:
  /api/subscriptions:
    get:
      summary: List subscriptions
      operationId: listSubscriptions
      responses:
        "200":
          description: All subscriptions currently held in memory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      summary: Add a subscription
      operationId: addSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSubscriptionRequest"
      responses:
        "201":
          description: Subscription added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          description: Empty or whitespace-only URL
components:
  schemas:
    Subscription:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          example: https://example.com/feed.xml
    AddSubscriptionRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          example: https://example.com/feed.xml
